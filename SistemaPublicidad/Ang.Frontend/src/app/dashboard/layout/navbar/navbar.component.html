<nav class="navbar">
  <div class="navbar__container">
    <div class="navbar__brand">
      <h1 class="navbar__title">{{ brandName }}</h1>
      <p class="navbar__subtitle">Centro de control de publicidad</p>
    </div>

    <ul class="navbar__menu">
      <li class="navbar__menu-item">
        <button
          class="navbar__button navbar__theme-button"
          (click)="toggleTema()"
          title="Cambiar tema"
        >
          {{ temaLabel }}
        </button>
      </li>
      @for (section of sections; track section.id) {
        <li class="navbar__menu-item">
          <button
            class="navbar__button"
            [class.navbar__button--active]="activeSection === section.id"
            [class.navbar__button--advertencia]="section.id === 'Publicidades' && (section.alert === 'warning' || section.alert === 'danger')"
            (click)="selectSection(section.id)"
          >
            {{ section.label }}
          </button>
        </li>
      }
    </ul>

  </div>

</nav>
